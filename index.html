<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资源索引</title>
<style>
  body { margin:0; background:#fff; color:#24292f; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:32px 20px 48px; }
  h1 { font-size:22px; font-weight:600; margin:0 0 6px; }
  .sub { color:#57606a; font-size:14px; margin-bottom:28px; }
  h2 { font-size:15px; font-weight:600; border-bottom:1px solid #d8dee4; padding-bottom:6px; margin:26px 0 10px; }
  ul { list-style:none; padding:0; margin:0; }
  li { padding:7px 0; font-size:14px; line-height:1.7; }
  a { color:#0969da; text-decoration:none; }
  a:hover { text-decoration:underline; }
  .desc { color:#57606a; }
  .foot { margin-top:36px; color:#8b949e; font-size:12px; line-height:2; border-top:1px solid #eaeef2; padding-top:14px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>资源索引</h1>
    <div class="sub">公开资源的分类索引与镜像，按主题整理，不定期更新。</div>

    <h2>工具</h2>
    <ul>
      <li><a href="https://github.com/MusuOS/bili-agent">bili-agent</a> <span class="desc">— bilibili 自动化工具（弹幕、私信处理）</span></li>
    </ul>

    <h2>说明</h2>
    <ul>
      <li class="desc">只收录公开渠道可获取的内容，并注明出处。</li>
      <li class="desc">个人维护的非营利整理项目。</li>
    </ul>

    <div class="foot">resource-index · 内容来自公开渠道</div>
  </div>

</html>
